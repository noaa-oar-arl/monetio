name: Lint

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Opt into Node.js 24 for JavaScript actions to avoid deprecation warnings
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: pre-commit
        run: |
          pip install pre-commit
          pre-commit run --all-files

  cff:
    name: Validate CITATION.cff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: citation-file-format/cffconvert-github-action@2.0.0
        with:
          args: "--validate"

  spell:
    name: codespell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: codespell
        run: |
          pip install codespell
          codespell -I .codespell-exclude -S "./monetio/data/aqs_qualifiers.csv,./monetio/data/cemsinfo.csv,./monetio/data/stations.tsv" .
